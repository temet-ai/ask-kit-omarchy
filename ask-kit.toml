id = "temet.omarchy"
name = "omarchy"
version = "0.1.1"
min_ask_kit = "0.2.0"
requires = ["omarchy"]
platforms = ["linux"]
says = "Omarchy (the Arch Linux and Hyprland distribution) on this machine: which Omarchy version is installed and what the latest update changed, which omarchy-* commands exist for a job (omarchy theme, refresh, restart, toggle, bar, plugin, hook, install, capture), which theme is current and its colours, which themes are installed, which file to edit for a customisation and whether Omarchy's default or the user's override wins, whether the user's config has drifted from the defaults, how to make a theme, shell plugin, hook or screenshot, and building a desktop app for Omarchy (a Qt Quick, qmake and PKGBUILD project that follows the theme): checking that a project follows the conventions, scaffolding one; and acting on it (omarchy theme set, omarchy refresh, editing a user override file, scaffolding an app)"
keywords = ["omarchy", "screen lock", "lock after", "locks? the screen", "omarchy-[a-z-]+", "omarchy theme", "omarchy update", "omarchy version", "omarchy refresh", "omarchy menu", "shell\\.json", "o\\.rebind", "omarchy app", "qmake", "qt quick", "qml", "pkgbuild", "desktop entry"]
patterns = ['\b(which|what) omarchy\b', '\bomarchy (command|theme|version|update|default|menu|hook|plugin)s?\b', '\b(app|application) for omarchy\b']
route_hint = "Omarchy's own commands, its defaults-versus-overrides layout, its themes, its updates and the conventions for an app built for it are omarchy; which file under ~/.config sets some keybinding or setting in general is dotfiles; the live desktop (open windows, workspaces, monitors now, screenshots, clicking and typing) is desktop; coredumps and why a program crashed is crash; whether a service runs, its logs and timers are ops or systemd; what a past session did is sessions or mike"
cite = "`path:line` for a file, the `omarchy ...` command, or a package version"
instructions = "instructions.md"

acts = [
  "omarchy commands that change something, run through omarchy.run: theme set and bg next, font set, refresh, restart, toggle, bar move or set, plugin add, clone, enable, disable or remove, hook install, install, pkg add or remove, reminder with minutes, language, default, branch and channel set. Never run: update, reinstall, system, setup, launch, menu, agent",
  "omarchy.edit",
  "omarchy.write",
  "omarchy.scaffold",
  "hyprctl reload through omarchy.hypr",
]
reads = ["omarchy version", "omarchy theme list", "omarchy theme current", "omarchy theme bg current", "omarchy font list", "omarchy font current", "omarchy plugin list", "omarchy channel current", "omarchy update available", "omarchy commands", "omarchy battery status", "omarchy network status", "omarchy powerprofiles list"]

[[settings]]
key = "OMARCHY_PATH"
about = "the folder Omarchy ships its commands, defaults, stock themes and migrations in; packaged installs use /usr/share/omarchy, which is also tried when this folder does not exist"
default = "~/.local/share/omarchy"

[[sources]]
kind = "module"
name = "omarchy"
module = "omarchy.mjs"
api = "api.d.ts"

[[roles]]
name = "customizer"
when = "a request to change how the desktop looks or behaves: a keybinding, monitors, gaps, a window rule, the bar, idle or lock time, a terminal setting, a theme, a hook, a reminder"
patterns = ["^(please )?(change|set|make|add|remove|move|bind|rebind|turn|toggle|switch|install)\\b.*\\b(theme|keybinding|binding|key|bar|gaps?|border|monitor|font|background|wallpaper|idle|lock|night ?light|widget|terminal|hook)\\b"]
instructions = "roles/customizer.md"

[[roles]]
name = "app-builder"
when = "a request to build, scaffold or check a desktop app for Omarchy: a Qt Quick, qmake, PKGBUILD or desktop-entry project"
patterns = ["\\b(scaffold|build|make|create|check)\\b.*\\b(app|qt|qml|pkgbuild|desktop entry|launcher entry)\\b"]
instructions = "roles/app-builder.md"
